<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALL POWER Group Dashboard v5</title>

<!-- ===================================================
     GOOGLE FONTS — โหลดฟอนต์จาก Google
     Sarabun = ฟอนต์ภาษาไทย อ่านง่าย สวยงาม
     =================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
/* ===================================================
   CSS VARIABLES — กำหนดสีและค่าต่าง ๆ กลาง ๆ ไว้ที่นี่
   ที่เดียว เวลาแก้สี แก้แค่ที่เดียวทั้งเว็บก็เปลี่ยน
   =================================================== */
:root {
  --navy:      #1b3a5c;   /* สีหลัก navy เข้ม */
  --blue:      #2563a8;   /* สีฟ้ากลาง */
  --blue-lt:   #4a86c8;   /* สีฟ้าอ่อน */
  --sky:       #e8f0fa;   /* พื้นหลังฟ้าอ่อนมาก */
  --red:       #c0392b;   /* สีแดง (ตปท. / ลบ) */
  --orange:    #d9651a;   /* สีส้ม (ฝากของ) */
  --green:     #1a7a4a;   /* สีเขียว (กำไร) */
  --amber:     #b8860b;   /* สีทอง */
  --white:     #ffffff;
  --gray-50:   #f8f9fc;
  --gray-100:  #eef1f6;
  --gray-200:  #dde2ec;
  --gray-400:  #8a94a8;
  --gray-700:  #3d4a5e;
  --text:      #1a2a3a;   /* สีตัวอักษรหลัก */
  --radius:    10px;
  --shadow:    0 2px 12px rgba(27,58,92,0.09);
  --shadow-lg: 0 4px 24px rgba(27,58,92,0.14);
}

/* ===================================================
   RESET — ล้างค่า default ของ browser ออก
   ทุก element ให้เริ่มต้นเท่ากันก่อน
   =================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ===================================================
   BODY — ตัวหน้าเว็บทั้งหมด
   =================================================== */
body {
  font-family: 'Sarabun', sans-serif;
  background: #dce8f5;            /* พื้นหลังฟ้าอ่อน */
  background-image:               /* ลวดลายจุดเล็กๆ สร้าง texture */
    radial-gradient(circle, rgba(37,99,168,0.06) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--text);
  padding: 1.5rem 2rem;
  font-size: 16px;
  min-height: 100vh;
}

/* ===================================================
   HEADER — หัวเรื่องด้านบน
   =================================================== */
.page-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 1.5rem;
}
.page-header-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--blue), var(--navy));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(37,99,168,0.3);
}
.page-title { font-size: 24px; font-weight: 800; color: var(--navy); letter-spacing: -0.3px; }
.page-subtitle { font-size: 17px; color: var(--gray-400); font-weight: 500; margin-top: 2px; }

/* ===================================================
   KPI CARDS — การ์ดสรุปข้อมูลด้านบน
   display:grid = จัดเรียงแบบกริด
   repeat(auto-fill, ...) = ยืดหดตามขนาดหน้าจออัตโนมัติ
   =================================================== */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 100px;
  margin-bottom: 1.5rem;
}
.metric {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border-top: 3px solid transparent;  /* เส้นสีด้านบนการ์ด */
  transition: transform 0.15s, box-shadow 0.15s;
}
.metric:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

/* border-top ของแต่ละการ์ด — สีต่างกันตามประเภท */
.metric.m-total   { border-top-color: var(--blue); }
.metric.m-amount  { border-top-color: var(--amber); }
.metric.m-wait    { border-top-color: var(--red); }
.metric.m-abroad  { border-top-color: var(--red); }
.metric.m-stored  { border-top-color: var(--orange); }

.metric-label { font-size: 16px; color: var(--gray-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.metric-value { font-size: 33px; font-weight: 800; color: var(--navy); }
.metric-value.c-red    { color: var(--red); }
.metric-value.c-orange { color: var(--orange); }
.metric-value.c-amber  { color: var(--amber); }
.metric-value.c-blue   { color: var(--blue); }
.metric-sub { font-size: 16px; color: var(--gray-400); margin-top: 3px; font-weight: 500; }

/* ===================================================
   PANEL — กล่องหลักที่ครอบทุกอย่าง
   =================================================== */
.panel {
  background: var(--white);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.panel-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.panel-title { color: #fff; font-weight: 700; font-size: 25px; } 
.panel-body { padding: 16px 20px; }

/* ===================================================
   TOOLBAR — แถบค้นหาและ dropdown กรอง
   display:flex = จัดเรียงแนวนอน
   gap = ระยะห่างระหว่าง element
   flex-wrap:wrap = ถ้าไม่พอที่ให้ขึ้นบรรทัดใหม่
   =================================================== */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap;
  align-items: center;
}
.toolbar input, .toolbar select {
  font-family: 'Sarabun', sans-serif;
  font-size: 15px; font-weight: 600;
  padding: 9px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  background: var(--gray-50);
  color: var(--navy);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.toolbar input:focus, .toolbar select:focus {
  border-color: var(--blue-lt);
  box-shadow: 0 0 0 3px rgba(74,134,200,0.15);
  background: var(--white);
}
.toolbar input#searchInput { width: 440px; }


/* ===================================================
   SEARCH TAGS — ป้ายคำค้นหาที่เพิ่มแล้ว (กด Enter)
   =================================================== */
.tag-bar { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; margin-top: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--blue); color: #fff;
  border-radius: 20px; font-size: 12px; font-weight: 600;
  padding: 3px 10px 3px 13px;
}
.tag-x { cursor: pointer; opacity: 0.7; font-size: 15px; }
.tag-x:hover { opacity: 1; }

/* ===================================================
   COLUMN TOGGLE — ปุ่มซ่อน/แสดงคอลัมน์
   =================================================== */
.col-toggle-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center; padding: 12px 20px;
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-100);
}
.col-toggle-bar .label { font-size: 15px; font-weight: 700; color: #c0392b; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
.col-btn {
  font-family: 'Sarabun', sans-serif;
  font-size: 15px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px;
  border: 1.5px solid var(--gray-200);
  background: var(--white); color: var(--navy);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.col-btn:hover { background: #fde8e8;  border-color: #f5b7b1; color: #c0392b; }
.col-btn.hidden-col { background: #fde8e8; color: #c0392b; border-color: #f5b7b1; }

/* ===================================================
   SELECTION BAR — แถบเลือกรายการ (Checkbox)
   =================================================== */
.sel-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  background: linear-gradient(90deg, #e8f4ea, #f0f9f1);
  border-bottom: 1px solid #c3e6cb;
  font-size: 17px; font-weight: 700; color: var(--green);
  flex-wrap: wrap;
}
.sel-bar.hidden { display: none; }
.sel-info { color: var(--green); }
.sel-amounts { display: flex; gap: 16px; flex-wrap: wrap; }
.sel-amount-item { font-size: 17px; }
.sel-amount-item span { font-weight: 800; color: var(--navy); }
.btn-clear-sel {
  margin-left: auto;
  font-family: 'Sarabun', sans-serif;
  font-size: 12px; font-weight: 700;
  padding: 4px 14px; border-radius: 20px;
  border: 1.5px solid var(--green);
  background: var(--white); color: var(--green);
  cursor: pointer; transition: all 0.15s;
}
.btn-clear-sel:hover { background: var(--green); color: #fff; }

/* ===================================================
   TABLE WRAPPER — กล่องครอบตาราง
   overflow-x:auto = เลื่อนซ้าย-ขวาได้ถ้าตารางกว้างเกิน
   =================================================== */
.tbl-wrap { overflow-x: auto; }

/* ===================================================
   TABLE — ตารางหลัก
   border-collapse:collapse = ไม่มีช่องว่างระหว่าง cell
   =================================================== */
table { width: 100%; border-collapse: collapse; font-size: 14px; }

/* HEADER ROW — แถวหัวตาราง */
thead th {
  background: var(--navy);
  color: #fff; font-weight: 700;
  padding: 11px 10px;
  text-align: right; white-space: nowrap;
  border-bottom: 2px solid var(--blue);
  cursor: pointer; user-select: none;
  font-size: 17px;
  position: sticky; top: 0; z-index: 2;  /* ติดด้านบนเมื่อเลื่อน scroll */
}
thead th.left   { text-align: left; }
thead th.center { text-align: center; }
thead th:hover  { background: var(--blue); }
.sort-arrow { font-size: 13px; margin-left: 3px; opacity: 0.35; }
.sort-active .sort-arrow { opacity: 1; color: #ffd700; font-size: 18px;}

/* เส้นแบ่งกลุ่มคอลัมน์ */
thead th.grp-l { border-left: 2px solid rgba(255,255,255,0.2); }
tbody td.grp-l { border-left: 1px solid var(--gray-100); }

/* BODY ROWS — แถวข้อมูล */
tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #eef4fc; }
tbody tr.has-update { background: #edfcf2; }
tbody tr.has-update:hover { background: #d6f5e3; }

/* แถวที่ถูกเลือก (tick checkbox) */
tbody tr.selected-row { background: #dbeafe !important; }
tbody tr.selected-row:hover { background: #bfdbfe !important; }

/* TD — ข้อมูลในแต่ละช่อง */
td {
  padding: 9px 10px; text-align: right;
  color: var(--text); white-space: nowrap;
  vertical-align: middle; font-weight: 600;
  font-size: 15px;
}
td.left   { text-align: left; }
td.center { text-align: center; }

/* CHECKBOX COLUMN */
td.col-check, th.col-check { text-align: center; padding: 6px 8px; width: 36px; }
input[type="checkbox"] { cursor: pointer; accent-color: var(--blue); width: 15px; height: 15px; }

/* DATA STYLE CLASSES — class สำหรับสีพิเศษของข้อมูล */
td.so       { font-weight: 700; color: var(--navy); font-size: 15px; }
td.item     { font-weight: 700; color: var(--navy); }
td.price-col  { color: var(--navy); }
td.num        { color: var(--navy); }
td.sale-val   { font-weight: 700; color: var(--navy); }
.deposit-qty  { font-weight: 800; color: var(--red); }
.deposit-val  { font-weight: 700; color: var(--red); }
.stored-qty   { font-weight: 800; color: var(--orange); }
td.profit-neg { color: var(--red); font-weight: 800; }

/* update badge เล็กๆ ข้างตัวเลข */
.delta-in {
  font-size: 10px; font-weight: 700; color: #155724;
  background: #d1f7dc; border-radius: 4px;
  padding: 1px 5px; display: inline-block; margin-right: 3px;
}
.update-inline {
  font-size: 10px; font-weight: 600; color: #155724;
  background: #d1f7dc; border-radius: 4px;
  padding: 1px 5px; display: inline-block; margin-left: 4px;
}
span.dim { color: var(--gray-200); font-weight: 400; }

/* STATUS BADGE — ป้ายสถานะ */
.badge {
  display: inline-block; border-radius: 5px;
  font-size: 14px; font-weight: 700; padding: 3px 10px;
  white-space: nowrap; letter-spacing: 0.02em;
}
.badge-ready   { background: #2563a8; color: #fff; }
.badge-abroad  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.badge-partial { background: var(--gray-100); color: var(--gray-700); }
.badge-stored  { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

/* ===================================================
   FOOTER — แถวรวมยอดด้านล่างตาราง
   =================================================== */
tfoot tr { background: #eef3fb; border-top: 2px solid var(--blue); }
tfoot td {
  padding: 10px 10px; font-weight: 800;
  color: var(--navy); font-size: 17px;
  text-align: right; white-space: nowrap;
}
tfoot td.left { text-align: left; }
tfoot td.total-sale   { color: var(--navy); }
tfoot td.total-inv    { color: var(--red); }
tfoot td.total-profit { color: var(--green); }
tfoot td.total-profit-neg { color: var(--red); }

/* ===================================================
   COMPUTED CELL — คอลัมน์ที่คำนวณอัตโนมัติ
   แสดงไอคอน ⚡ เล็กๆ ให้รู้ว่าคำนวณจากสูตร
   =================================================== */

/* ===================================================
   RESPONSIVE — ปรับขนาดบนมือถือ
   @media = "ถ้าหน้าจอกว้างไม่เกิน X px ให้ใช้ style นี้"
   =================================================== */
@media (max-width: 768px) {
  body { padding: 0.8rem; font-size: 14px; }
  .toolbar input#searchInput { width: 100%; }
  .page-title { font-size: 18px; }
}

/* ===================================================
   SELECTED FOOTER — แถบสรุปรายการที่เลือก (sticky)
   position:sticky ติดด้านล่างหน้าจอเสมอ
   =================================================== */
.selected-footer {
  position: sticky; bottom: 0;
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: #fff;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  box-shadow: 0 -4px 20px rgba(27,58,92,0.25);
  border-radius: 16px 14px 0 0;
  font-size: 13px; font-weight: 600;
  transition: all 0.2s;
}
.selected-footer.hidden { display: none; }
.sel-footer-title { font-weight: 800; font-size: 14px; opacity: 0.85; } /*รายการที่เลือก*/
.sel-footer-items { display: flex; gap: 24px; flex-wrap: wrap; }
.sel-footer-item { text-align: right; }
.sel-footer-item .lbl { font-size: 13px; opacity: 0.7; display: block; }
.sel-footer-item .val { font-size: 17px; font-weight: 800; }
.val-red    { color: #fca5a5; }
.val-yellow { color: #fde68a; }
.val-white  { color: #fff; }
.btn-clear {
  margin-left: auto;
  background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.35);
  color: #fff; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px;
  cursor: pointer; transition: all 0.15s;
}
.btn-clear:hover { background: rgba(255,255,255,0.3); }
</style>
</head>

<body>

<!-- ===================================================
     PAGE HEADER — หัวเรื่อง
     =================================================== -->
<div class="page-header">
  <div>
    <div class="page-title">ALL POWER Group Dashboard</div>
    <div class="page-subtitle">อัปเดต 1 พฤษภาคม 2026</div>
  </div>
</div>

<!-- ===================================================
     KPI CARDS — สรุปข้อมูลด้านบน
     id="summaryGrid" คือ JavaScript จะมาใส่ข้อมูลตรงนี้
     =================================================== -->
<div class="summary-grid" id="summaryGrid"></div>

<!-- ===================================================
     MAIN PANEL — กล่องหลักครอบตาราง
     =================================================== -->
<div class="panel">

  <!-- PANEL HEADER -->
  

  <!-- COLUMN TOGGLE — ปุ่มซ่อน/แสดงคอลัมน์ -->
  <div class="col-toggle-bar">
    <span class="label">ซ่อน ▸</span>
    <button class="col-btn" data-col="salePrice">Unit Price</button>
    <button class="col-btn" data-col="saleAmt">Amount </button>
    <button class="col-btn" data-col="order">QTY.</button>
    <button class="col-btn" data-col="deposit">รอ INV.</button>
    <button class="col-btn" data-col="depositVal">มูลค่า </button>
    <button class="col-btn" data-col="inv">INV.</button>
    <button class="col-btn" data-col="stored">ฝากของ</button>
    <button class="col-btn" data-col="remain">ตปท. </button>
    <button class="col-btn" data-col="status">สถานะ</button>
    <button class="col-btn" data-col="salesco">Sales Co.</button>
    <button class="col-btn" data-col="costPrice" >ต้นทุน/ชิ้น</button>
    <button class="col-btn" data-col="costAmt" >ยอดต้นทุน</button>
    <button class="col-btn" data-col="profit">กำไร</button>
  </div>

  <!-- FILTER BAR — ค้นหา + dropdown กรอง -->
  <div class="panel-body" style="padding-bottom:12px;">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="🔍  ค้นหา SO / Item / Sales Co. — กด Enter เพิ่ม Tag"/>
      <select id="filterStatus">
        <option value="">📊 สถานะทั้งหมด</option>
        <option value="abroad">ตปท.</option>
        <option value="ready">พร้อมส่ง</option>
    
    
      </select>
      <select id="filterSales">
        <option value="">👤 Sales Co. ทั้งหมด</option>
        <option value="Papitchaya">Papitchaya</option>
        <option value="Jureemas">Jureemas</option>
        <option value="Patcharaporn">Patcharaporn</option>
      </select>
    </div>
    <!-- TAG BAR — แสดงคำค้นหาที่เพิ่มไว้ -->
    <div class="tag-bar" id="tagBar"></div>
  </div>

  <!-- ===================================================
       TABLE — ตารางแสดงข้อมูล
       =================================================== -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr id="headerRow">
          <!-- th.col-check = คอลัมน์ checkbox เลือกทั้งหมด -->
          <th class="col-check center">
            <input type="checkbox" id="checkAll" title="เลือกทั้งหมด"/>
          </th>
          <th class="left"   style="min-width:92px"  data-col="so">Sales Order <span class="sort-arrow">↕</span></th>
          <th class="left"   style="min-width:115px" data-col="item">Item <span class="sort-arrow">↕</span></th>
          <th data-th="salePrice"  style="min-width:80px"  data-col="salePrice">Unit Price <span class="sort-arrow">↕</span></th>
          <th data-th="costPrice"  style="min-width:80px"  data-col="costPrice">ต้นทุน/ชิ้น <span class="sort-arrow">↕</span></th>
          <!-- ⚡ = คอลัมน์คำนวณอัตโนมัติ (Unit Price × QTY.) -->
          <th data-th="saleAmt"    style="min-width:120px" data-col="saleAmt">Amount<span class="calc-tag" title="คำนวณจาก Unit Price × QTY."></span> <span class="sort-arrow">↕</span></th>
          <th data-th="costAmt"    style="min-width:115px" data-col="costAmt">ยอดต้นทุน <span class="sort-arrow">↕</span></th>
          <th data-th="profit"     style="min-width:110px" data-col="profit">กำไร <span class="sort-arrow">↕</span></th>
          <th data-th="order"      style="min-width:58px"  data-col="order">QTY. <span class="sort-arrow">↕</span></th>
          <th data-th="deposit"    class="grp-l" style="min-width:60px" data-col="deposit">รอ INV. <span class="sort-arrow">↕</span></th>
          <!-- ⚡ = Unit Price × รอ INV. -->
          <th data-th="depositVal" style="min-width:110px" data-col="depositVal">มูลค่า<span class="calc-tag" title="คำนวณจาก Unit Price × รอ INV."></span> <span class="sort-arrow">↕</span></th>
          <th data-th="inv"        class="grp-l" style="min-width:55px"  data-col="inv">INV. <span class="sort-arrow">↕</span></th>
          <th data-th="stored"     style="min-width:68px"  data-col="stored">ฝากของ <span class="sort-arrow">↕</span></th>
          <!-- ⚡ = QTY. - รอ INV. - INV. -->
          <th data-th="remain"     class="grp-l" style="min-width:60px"  data-col="remain">ตปท.<span class="calc-tag" title="คำนวณจาก QTY. − รอ INV. − INV."></span> <span class="sort-arrow">↕</span></th>

];

/* ===================================================
   COMPUTED — คำนวณค่าอัตโนมัติ
   forEach = วนลูปทุก element ใน array
   r = ตัวแปรชั่วคราว แทนแต่ละ object ใน raw[]
   ===================================================

   สูตรที่ใช้:
   1. saleAmt   = Unit Price (salePrice) × QTY. (order)
   2. depositVal= Unit Price (salePrice) × รอ INV. (deposit)
   3. remain    = QTY. (order) − รอ INV. (deposit) − INV. (inv)
   4. costAmt   = ต้นทุน/ชิ้น × QTY. (ถ้ามีข้อมูลต้นทุน)
   5. profit    = Amount − ยอดต้นทุน (ถ้ามีข้อมูลต้นทุน)
   =================================================== */
raw.forEach(r => {
  /* 1. Amount = Unit Price × QTY. */
  r.saleAmt   = r.salePrice * r.order;

  /* 2. มูลค่า = Unit Price × รอ INV. */
  r.depositVal = r.salePrice * r.deposit;

  /* 3. ตปท. = QTY. − รอ INV. − INV.
        Math.max(..., 0) = ไม่ให้ติดลบ กันกรณีข้อมูลผิดพลาด */
  r.remain = Math.max(r.order - r.deposit - r.inv, 0);

  /* 4. ยอดต้นทุน = ต้นทุน/ชิ้น × QTY. (null ถ้าไม่มีต้นทุน) */
  r.costAmt = (r.costPrice != null) ? r.costPrice * r.order : null;

  /* 5. กำไร = Amount − ยอดต้นทุน (null ถ้าไม่มีต้นทุน) */
  r.profit  = (r.costAmt  != null) ? r.saleAmt - r.costAmt : null;
});

/* ===================================================
   STATUS LOGIC — กำหนดสถานะแต่ละรายการ
   ===================================================

   เงื่อนไขสถานะ:
   'stored'  = มีของฝาก (stored > 0) — เช็คก่อนเลย
   'abroad'  = ตปท. (deposit=0 และ remain>0)
   'ready'   = พร้อมส่ง (มี deposit อยู่)
   'partial' = บางส่วน (มี inv แล้ว)
   =================================================== */
function getStatus(r) {
  if (r.stored > 0)                   return 'ready';   /* มีฝากของ */
  if (r.deposit === 0 && r.remain > 0) return 'abroad';  /* ตปท. */
  if (r.deposit > 0)                  return 'ready';    /* พร้อมส่ง */
  return 'partial';                                      /* บางส่วน / อื่นๆ */
}

/* ===================================================
   FORMAT HELPERS — ฟังก์ชันแปลงตัวเลขให้อ่านง่าย
   ===================================================
   fmt(n)      = แสดงตัวเลขมี comma เช่น 1,234 หรือ "-" ถ้า 0
   fmtMoney(n) = เหมือน fmt แต่มีทศนิยม 2 ตำแหน่ง
   dash(n)     = แสดงตัวเลขหรือ "-" ถ้าเป็น 0
   =================================================== */
function fmt(n) {
  /* toLocaleString = แปลงตัวเลขให้มี comma ตามรูปแบบไทย */
  return (n != null && n !== 0) ? n.toLocaleString('th-TH') : '-';
}

function fmtMoney(n) {
  if (n == null || n === 0) return '<span class="dim">-</span>';
  /* minimumFractionDigits:2 = แสดงทศนิยม 2 ตำแหน่งเสมอ */
  return n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function dash(n) {
  /* Template literal (backtick) = ใส่ตัวแปรใน HTML string ด้วย ${} */
  return (n != null && n > 0) ? `<span style="font-weight:700">${fmt(n)}</span>` : `<span class="dim">-</span>`;
}

/* ===================================================
   SORT STATE — จำว่ากำลัง sort คอลัมน์ไหน ทิศทางไหน
   sortCol = ชื่อคอลัมน์ที่ sort อยู่
   sortDir = 1 (น้อยไปมาก ↑) หรือ -1 (มากไปน้อย ↓)
   =================================================== */
let sortCol = 'depositVal';
let sortDir = -1;

/* ===================================================
   COLUMN VISIBILITY — ซ่อน/แสดงคอลัมน์
   Set = โครงสร้างข้อมูลเหมือน Array แต่ไม่ซ้ำกัน
   ค่าเริ่มต้น: ซ่อน 3 คอลัมน์นี้ไว้ก่อน
   =================================================== */
const hiddenCols = new Set(['costPrice', 'costAmt', 'profit','salePrice' , 'saleAmt' ]);

/* ===================================================
   SELECTED ROWS — เก็บรายการที่ถูก tick checkbox
   Set เก็บ index ของ row ใน raw[] ที่ถูกเลือก
   =================================================== */
let selectedRows = new Set();

/* ===================================================
   SEARCH TAGS — เก็บคำค้นหาที่กด Enter เพิ่มไว้
   =================================================== */
let searchTags = [];

/* ===================================================
   DOM REFERENCES — ดึง element จาก HTML มาเก็บไว้

const searchInput = document.getElementById('searchInput');
const tagBar      = document.getElementById('tagBar');

/* ===================================================
   renderSummary() — วาด KPI CARDS ด้านบน
   คำนวณยอดรวมและนับสถานะจาก raw[] ทั้งหมด
   =================================================== */
function renderSummary() {
  /* นับจำนวนรายการแต่ละสถานะ */
  const counts = {abroad:0, partial:0, ready:0, stored:0};
  raw.forEach(r => {
    const s = getStatus(r);
    if (counts[s] !== undefined) counts[s]++;
  });

  /* คำนวณยอดรวม Amount และ มูลค่ารอ INV. */
  const totalSale    = raw.reduce((sum, r) => sum + (r.saleAmt    || 0), 0);
  const totalWaitInv = raw.reduce((sum, r) => sum + (r.depositVal || 0), 0);

  /* innerHTML = ใส่ HTML เข้าไปใน element */
  document.getElementById('summaryGrid').innerHTML = `
    <div class="metric m-total">
      <div class="metric-label">รายการทั้งหมด</div>
      <div class="metric-value c-blue">${raw.length}</div>

      <div class="metric-value c-red">${counts.abroad}</div>
      <div class="metric-sub">รายการ</div>
    </div>
   

    
    <div class="metric m-total">
      <div class="metric-label">พร้อมส่ง</div>
      <div class="metric-value c-blue">${counts.ready}</div>
      <div class="metric-sub">รายการ</div>

}

/* ===================================================
   renderTags() — วาด Search Tags บน toolbar
   =================================================== */
function renderTags() {
  /* map = แปลง array ของ string เป็น array ของ HTML string */
  tagBar.innerHTML = searchTags.map((t, i) =>
    `<span class="tag">${t} <span class="tag-x" data-i="${i}">×</span></span>`
  ).join('');

  /* เพิ่ม event listener ให้ปุ่ม × ของแต่ละ tag */
  tagBar.querySelectorAll('.tag-x').forEach(x => {
    x.addEventListener('click', () => {
      /* splice = ลบ element ออกจาก array ณ ตำแหน่ง i */
      searchTags.splice(+x.dataset.i, 1);
      renderTags();
      renderTable();
    });
  });
}

/* ===================================================
   updateSelectedFooter() — อัพเดต sticky footer
   แสดงผลรวมของรายการที่ถูก tick checkbox
   =================================================== */
function updateSelectedFooter() {
  const footer = document.getElementById('selectedFooter');

  /* ถ้าไม่มีรายการที่เลือก ซ่อน footer */
  if (selectedRows.size === 0) {
    footer.classList.add('hidden');
    return;
  }

  footer.classList.remove('hidden');

  /* รวมยอดจากรายการที่เลือกเท่านั้น */
  let sumAmount    = 0;
  let sumDepositVal = 0;
  let sumRemain    = 0;

  /* วนลูปผ่าน Set ด้วย for...of */
  for (const idx of selectedRows) {
    const r = raw[idx];
    sumAmount     += r.saleAmt    || 0;
    sumDepositVal += r.depositVal || 0;
    sumRemain     += r.remain     || 0;
  }

  /* อัพเดตตัวเลขใน footer */
  document.getElementById('selCount').textContent     = selectedRows.size + ' รายการ';
  document.getElementById('selAmount').textContent    = fmtMoney(sumAmount).replace(/<[^>]+>/g,'') + ' ฿';
  document.getElementById('selDepositVal').textContent = fmtMoney(sumDepositVal).replace(/<[^>]+>/g,'') + ' ฿';
  document.getElementById('selRemain').textContent    = fmt(sumRemain);
}

/* ===================================================
   renderTable() — วาดตารางทั้งหมด
   ฟังก์ชันหลักที่เรียกทุกครั้งที่ filter/sort เปลี่ยน
   =================================================== */
function renderTable() {
  /* ดึงค่าจาก input/select ปัจจุบัน */
  const liveSearch   = searchInput.value.trim().toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const salesFilter  = document.getElementById('filterSales').value;

  /* รวม tags ที่กด Enter ไว้แล้ว + keyword ที่พิมพ์อยู่ตอนนี้ */
  const allKeywords = [...searchTags, ...(liveSearch ? [liveSearch] : [])];

  /* ===================================================
     FILTER — กรองข้อมูล
     filter = คืน array ใหม่ที่มีเฉพาะรายการที่ผ่านเงื่อนไข
     =================================================== */
  let filtered = raw.filter((r, idx) => {
    /* เช็คว่า keyword ตรงกับ so, item หรือ salesco */
    const matchSearchOR = allKeywords.length === 0 || allKeywords.some(kw =>
      r.so.toLowerCase().includes(kw) ||
      r.item.toLowerCase().includes(kw) ||
      r.salesco.toLowerCase().includes(kw)
    );
    const matchStatus = !statusFilter || getStatus(r) === statusFilter;
    const matchSales  = !salesFilter  || r.salesco === salesFilter;
    return matchSearchOR && matchStatus && matchSales;
  });

  /* ===================================================
     SORT — เรียงลำดับข้อมูล
     sort = เรียง array ใหม่ตามเงื่อนไขที่กำหนด
     a, b = สองรายการที่กำลังเปรียบเทียบกัน
     sortDir * (...) = คูณด้วย 1 หรือ -1 เพื่อกลับทิศ
     =================================================== */
  filtered.sort((a, b) => {
    if (sortCol === 'salesco') return sortDir * a.salesco.localeCompare(b.salesco);
    if (sortCol === 'status')  return sortDir * getStatus(a).localeCompare(getStatus(b));
    if (sortCol === 'item')    return sortDir * a.item.localeCompare(b.item);
    if (sortCol === 'so')      return sortDir * a.so.localeCompare(b.so);
    /* สำหรับคอลัมน์ตัวเลข: ลบกันเพื่อเปรียบเทียบ */
    return sortDir * ((a[sortCol] || 0) - (b[sortCol] || 0));
  });

  /* อัพเดตตัวนับแถว */

  /* ===================================================
     BUILD ROWS — สร้าง HTML ของแต่ละแถว
     map = แปลงแต่ละ object เป็น string HTML
     join('') = รวม array ของ string เป็น string เดียว
     =================================================== */
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = filtered.map((r) => {

    /* หา index จริงใน raw[] เพื่อใช้กับ selectedRows */
    const rawIdx = raw.indexOf(r);
    const isChecked = selectedRows.has(rawIdx);

    /* สร้าง badge สถานะ */
    const s = getStatus(r);
    const badge =
      s === 'ready'   ? '<span class="badge badge-ready">พร้อมส่ง</span>' :
      s === 'abroad'  ? '<span class="badge badge-abroad">ตปท.</span>'     :
      s === 'partial' ? '<span class="badge badge-partial">บางส่วน</span>' :
      s === 'stored'  ? '<span class="badge badge-stored">พร้อมส่ง</span>'   : '';

    /* cell รอ INV. — แสดง badge update ถ้ามี depositIn */
    let depositCell;
    if (r.deposit > 0) {
      const delta = r.depositIn > 0 ? `<span class="delta-in">+${fmt(r.depositIn)}</span>` : '';
      const upd   = r.update        ? `<span class="update-inline">${r.update}</span>` : '';
      depositCell = `${delta}<span class="deposit-qty">${fmt(r.deposit)}</span>${upd}`;
    } else {
      depositCell = `<span class="dim">-</span>`;
    }

    /* cell มูลค่า — แดงถ้ามีค่า */
    const depositValCell = r.depositVal > 0
      ? `<span class="deposit-val">${fmtMoney(r.depositVal)} ฿</span>`
      : `<span class="dim">-</span>`;

    /* cell ฝากของ — สีส้มถ้ามีค่า */
    const storedCell = r.stored > 0
      ? `<span class="stored-qty">${fmt(r.stored)}</span>`
      : `<span class="dim">-</span>`;

    /* class ของ tr — ถ้าเลือกแล้วใส่ selected-row */
    const rowClass = isChecked ? 'selected-row' : (r.depositIn > 0 ? 'has-update' : '');

    /* Return HTML string ของ 1 แถว
       data-rawidx="${rawIdx}" เก็บ index ไว้ให้ checkbox ใช้ */
    return `<tr class="${rowClass}" data-rawidx="${rawIdx}">
      <td class="col-check center">
        <input type="checkbox" class="row-check" data-idx="${rawIdx}" ${isChecked ? 'checked' : ''}/>
      </td>
      <td class="so left">${r.so}</td>
      <td class="item left">${r.item}</td>
      <td class="price-col" data-td="salePrice">${fmt(r.salePrice)} ฿</td>
      <td class="price-col" data-td="costPrice" style="color:#8a7060">
        ${r.costPrice != null ? fmt(r.costPrice)+' ฿' : '<span class="dim">-</span>'}
      </td>
      <!-- Amount = คำนวณจาก salePrice × order แล้ว (ใน COMPUTED) -->
      <td class="sale-val" data-td="saleAmt">${fmtMoney(r.saleAmt)} ฿</td>
      <td data-td="costAmt">
        ${r.costAmt != null && r.costAmt > 0 ? fmtMoney(r.costAmt)+' ฿' : '<span class="dim">-</span>'}
      </td>
      <td data-td="profit">
        ${r.profit == null ? '<span class="dim">-</span>' :
          r.profit > 0 ? `<span style="color:#1a7a4a;font-weight:700">${fmtMoney(r.profit)} ฿</span>` :
          r.profit < 0 ? `<span class="profit-neg">${fmtMoney(r.profit)} ฿</span>` :
          '<span class="dim">-</span>'}
      </td>
      <td class="num" data-td="order">${fmt(r.order)}</td>
      <td class="grp-l" data-td="deposit">${depositCell}</td>
      <!-- มูลค่า = คำนวณจาก salePrice × deposit แล้ว -->
      <td data-td="depositVal">${depositValCell}</td>
      <td class="grp-l" data-td="inv">${dash(r.inv)}</td>
      <td data-td="stored">${storedCell}</td>
      <!-- ตปท. = คำนวณจาก order - deposit - inv แล้ว -->
      <td class="grp-l" data-td="remain">${dash(r.remain)}</td>
      <td class="grp-l" data-td="status">${badge}</td>
      <td class="salesco left" data-td="salesco">${r.salesco}</td>
    </tr>`;
  }).join('');

  /* ===================================================
     FOOTER TOTALS — คำนวณผลรวมของแถวที่แสดงอยู่
     reduce = วนลูป array แล้วสะสมค่า (คล้าย sum)
     =================================================== */
  const tSale    = filtered.reduce((s, r) => s + (r.saleAmt    || 0), 0);
  const tWaitInv = filtered.reduce((s, r) => s + (r.depositVal || 0), 0);
  const tRemain  = filtered.reduce((s, r) => s + (r.remain     || 0), 0);
  const tOrder   = filtered.reduce((s, r) => s + (r.order      || 0), 0);
  const tInv     = filtered.reduce((s, r) => s + (r.inv        || 0), 0);

  const tCost    = filtered.every(r => r.costAmt == null) ? null
                 : filtered.reduce((s, r) => s + (r.costAmt || 0), 0);
  const tProfit  = tCost != null ? tSale - tCost : null;
  const profitClass = tProfit == null ? '' : tProfit >= 0 ? 'total-profit' : 'total-profit-neg';

  document.getElementById('tableFoot').innerHTML = `<tr>
    <td></td>
    <td class="left" colspan="2" style="font-weight:800;color:#1b3a5c;font-size:17px">รวมทั้งหมด ${filtered.length} รายการ</td>
    <td data-td="salePrice"></td>
    <td data-td="costPrice"></td>
    <td class="total-sale" data-td="saleAmt">${fmtMoney(tSale)} ฿</td>
    <td class="total-cost" data-td="costAmt">${tCost != null ? fmtMoney(tCost)+' ฿' : '<span class="dim">-</span>'}</td>
    <td class="${profitClass}" data-td="profit">${tProfit != null ? fmtMoney(tProfit)+' ฿' : '<span class="dim">-</span>'}</td>
    <td data-td="order" style="font-weight:800">${fmt(tOrder)}</td>
    <td class="grp-l" data-td="deposit"></td>
    <td class="total-inv" data-td="depositVal">${fmtMoney(tWaitInv)} ฿</td>
    <td class="grp-l" data-td="inv" style="font-weight:800">${fmt(tInv)}</td>
    <td data-td="stored"></td>
    <td class="grp-l" data-td="remain" style="font-weight:800;color:#c0392b">${fmt(tRemain)}</td>
    <td class="grp-l" data-td="status"></td>
    <td data-td="salesco"></td>
  </tr>`;

  /* เรียก applyColVisibility หลังวาดตารางเสมอ */
  applyColVisibility();

  /* เพิ่ม event สำหรับ checkbox แต่ละแถว */
  bindRowCheckboxes();
}

/* ===================================================
   bindRowCheckboxes() — ผูก event กับ checkbox
   เรียกหลัง render ทุกครั้ง เพราะ tbody ถูกสร้างใหม่
   =================================================== */
function bindRowCheckboxes() {
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const idx = +cb.dataset.idx; /* + แปลง string เป็น number */
      if (cb.checked) {
        selectedRows.add(idx);
      } else {
        selectedRows.delete(idx);
      }
      /* อัพเดต style ของแถว */
      const tr = cb.closest('tr');
      tr.classList.toggle('selected-row', cb.checked);
      /* อัพเดต checkAll checkbox */
      syncCheckAll();
      updateSelectedFooter();
    });
  });
}

/* ===================================================
   syncCheckAll() — อัพเดต checkbox "เลือกทั้งหมด"
   indeterminate = สถานะ "บางส่วน" (สี่เหลี่ยมแทนติ๊ก)
   =================================================== */
function syncCheckAll() {
  const all = document.querySelectorAll('.row-check');
  const checked = document.querySelectorAll('.row-check:checked');
  const ca = document.getElementById('checkAll');
  ca.checked = checked.length > 0 && checked.length === all.length;
  ca.indeterminate = checked.length > 0 && checked.length < all.length;
}

/* ===================================================
   checkAll — เลือก/ยกเลิกทั้งหมด
   =================================================== */
document.getElementById('checkAll').addEventListener('change', function() {
  const checks = document.querySelectorAll('.row-check');
  checks.forEach(cb => {
    cb.checked = this.checked;
    const idx = +cb.dataset.idx;
    if (this.checked) selectedRows.add(idx);
    else              selectedRows.delete(idx);
    cb.closest('tr').classList.toggle('selected-row', this.checked);
  });
  updateSelectedFooter();
});

/* ===================================================
   ปุ่มล้างการเลือก — คลิกแล้วเคลียร์ทุกอย่าง
   =================================================== */
document.getElementById('btnClearSel').addEventListener('click', () => {
  selectedRows.clear();
  renderTable();         /* render ใหม่ให้ checkbox กลับเป็นว่าง */
  updateSelectedFooter();
});

/* ===================================================
   applyColVisibility() — ซ่อน/แสดงคอลัมน์
   =================================================== */
function applyColVisibility() {
  /* อัพเดตปุ่ม toggle */
  document.querySelectorAll('.col-btn').forEach(btn => {
    btn.classList.toggle('hidden-col', hiddenCols.has(btn.dataset.col));
  });
  /* ซ่อน/แสดง th header */
  document.querySelectorAll('thead th[data-th]').forEach(th => {
    th.style.display = hiddenCols.has(th.dataset.th) ? 'none' : '';
  });
  /* ซ่อน/แสดง td data ตาม data-td attribute */
  document.querySelectorAll('tbody td[data-td], tfoot td[data-td]').forEach(td => {
    td.style.display = hiddenCols.has(td.dataset.td) ? 'none' : '';
  });
}

/* ===================================================
   ปุ่ม Toggle Column — เพิ่ม event listener
   addEventListener = ฟังเหตุการณ์ (เช่น click)
   =================================================== */
document.querySelectorAll('.col-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.dataset.col;
    /* toggle = เพิ่มถ้าไม่มี / ลบถ้ามีอยู่ */
    if (hiddenCols.has(col)) hiddenCols.delete(col);
    else hiddenCols.add(col);
    renderTable();
  });
});

/* ===================================================
   SORT — คลิก header เพื่อ sort
   =================================================== */
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    /* ถ้า click คอลัมน์เดิม → กลับทิศ | ถ้าคอลัมน์ใหม่ → เริ่ม asc */
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }

    /* รีเซ็ต sort arrow ทุก th */
    document.querySelectorAll('thead th').forEach(t => {
      t.classList.remove('sort-active');
      const a = t.querySelector('.sort-arrow');
      if (a) a.textContent = '↕';
    });
    /* ไฮไลท์ th ที่ sort อยู่ */
    th.classList.add('sort-active');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    renderTable();
  });
});

/* ===================================================
   SEARCH — ฟัง event จาก input ค้นหา
   keydown = เมื่อกดปุ่มใน keyboard
   input   = เมื่อพิมพ์ (live search)
   =================================================== */
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = searchInput.value.trim();
    /* เพิ่ม tag ถ้ายังไม่มีใน array */
    if (v && !searchTags.includes(v.toLowerCase())) {
      searchTags.push(v.toLowerCase());
      renderTags();
      searchInput.value = ''; /* เคลียร์ input */
      renderTable();
    }
  }
});
searchInput.addEventListener('input', renderTable); /* live search */

/* dropdown filter — เมื่อเปลี่ยนค่าให้ renderTable */
['filterStatus', 'filterSales'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderTable)
);

/* ===================================================
   INIT — เรียกครั้งแรกเมื่อหน้าโหลดเสร็จ
   =================================================== */
renderSummary();   /* วาด KPI cards */
renderTable();     /* วาดตาราง */
</script>
</body>
</html>
