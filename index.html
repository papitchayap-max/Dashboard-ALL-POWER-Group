<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALL POWER Group Dashboard v6</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:      #1b3a5c;
  --blue:      #2563a8;
  --blue-lt:   #4a86c8;
  --sky:       #e8f0fa;
  --red:       #c0392b;
  --orange:    #d9651a;
  --green:     #1a7a4a;
  --amber:     #b8860b;
  --white:     #ffffff;
  --gray-50:   #f8f9fc;
  --gray-100:  #eef1f6;
  --gray-200:  #dde2ec;
  --gray-400:  #8a94a8;
  --gray-700:  #3d4a5e;
  --text:      #1a2a3a;
  --radius:    10px;
  --shadow:    0 2px 12px rgba(27,58,92,0.09);
  --shadow-lg: 0 4px 24px rgba(27,58,92,0.14);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', sans-serif;
  background: #dce8f5;
  background-image: radial-gradient(circle, rgba(37,99,168,0.06) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--text);
  padding: 1.5rem 2rem;
  font-size: 18px;
  min-height: 100vh;
}

/* LOADING OVERLAY */
#loadingOverlay {
  position: fixed; inset: 0;
  background: rgba(27,58,92,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(3px);
}
#loadingOverlay.hidden { display: none; }
.loading-box {
  background: #fff; border-radius: 16px;
  padding: 32px 48px; text-align: center;
  box-shadow: 0 8px 40px rgba(27,58,92,0.25);
}
.spinner {
  width: 40px; height: 40px;
  border: 4px solid var(--gray-200);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 16px; font-weight: 600; color: var(--navy); }

/* HEADER */
.page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
.page-title { font-size: 24px; font-weight: 800; color: var(--navy); letter-spacing: -0.3px; }
.page-subtitle { font-size: 17px; color: var(--gray-400); font-weight: 500; margin-top: 2px; }
.btn-admin {
  margin-left: auto;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px; font-weight: 700;
  padding: 9px 20px; border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, var(--blue), var(--navy));
  color: #fff; cursor: pointer;
  box-shadow: 0 2px 8px rgba(37,99,168,0.3);
  transition: all 0.15s;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.btn-admin:hover { opacity: 0.88; transform: translateY(-1px); }

/* KPI CARDS */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 1.5rem;
}
.metric {
  background: var(--white); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: var(--shadow);
  border-top: 3px solid transparent;
  transition: transform 0.15s, box-shadow 0.15s;
}
.metric:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.metric.m-total   { border-top-color: var(--blue); }
.metric.m-amount  { border-top-color: var(--amber); }
.metric.m-wait    { border-top-color: var(--red); }
.metric.m-abroad  { border-top-color: var(--red); }
.metric.m-stored  { border-top-color: var(--orange); }
.metric-label { font-size: 13px; color: var(--gray-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.metric-value { font-size: 33px; font-weight: 800; color: var(--navy); }
.metric-value.c-red    { color: var(--red); }
.metric-value.c-orange { color: var(--orange); }
.metric-value.c-amber  { color: var(--amber); }
.metric-value.c-blue   { color: var(--blue); }
.metric-sub { font-size: 13px; color: var(--gray-400); margin-top: 3px; font-weight: 500; }

/* PANEL */
.panel { background: var(--white); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; margin-bottom: 1.5rem; }
.panel-body { padding: 16px 20px; }

/* TOOLBAR */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select {
  font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 600;
  padding: 9px 14px; border: 1.5px solid var(--gray-200);
  border-radius: 8px; background: var(--gray-50); color: var(--navy);
  outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.toolbar input:focus, .toolbar select:focus {
  border-color: var(--blue-lt);
  box-shadow: 0 0 0 3px rgba(74,134,200,0.15);
  background: var(--white);
}
.toolbar input#searchInput { width: 440px; }
.tag-bar { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; margin-top: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--blue); color: #fff;
  border-radius: 20px; font-size: 12px; font-weight: 600;
  padding: 3px 10px 3px 13px;
}
.tag-x { cursor: pointer; opacity: 0.7; font-size: 15px; }
.tag-x:hover { opacity: 1; }

/* COLUMN TOGGLE */
.col-toggle-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center; padding: 12px 20px;
  background: var(--gray-50); border-bottom: 1px solid var(--gray-100);
}
.col-toggle-bar .label { font-size: 13px; font-weight: 700; color: #c0392b; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
.col-btn {
  font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px;
  border: 1.5px solid var(--gray-200);
  background: var(--white); color: var(--navy);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.col-btn:hover { background: #fde8e8; border-color: #f5b7b1; color: #c0392b; }
.col-btn.hidden-col { background: #fde8e8; color: #c0392b; border-color: #f5b7b1; }

/* SELECTION BAR */

.sel-bar.hidden { display: none; }
.sel-amounts { display: flex; gap: 16px; flex-wrap: wrap; }
.sel-amount-item span { font-weight: 800; color: var(--navy); }

/* TABLE */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
thead th {
  background: var(--navy); color: #fff; font-weight: 700;
  padding: 11px 10px; text-align: right; white-space: nowrap;
  border-bottom: 2px solid var(--blue); cursor: pointer; user-select: none;
  font-size: 16px; position: sticky; top: 0; z-index: 2; 
}
thead th.left { text-align: left; }
thead th.center { text-align: center; }
thead th:hover { background: var(--blue); }
.sort-arrow { font-size: 13px; margin-left: 3px; opacity: 0.35; }
.sort-active .sort-arrow { opacity: 1; color: #ffd700; font-size: 16px; }
thead th.grp-l { border-left: 2px solid rgba(255,255,255,0.2); }
tbody td.grp-l { border-left: 1px solid var(--gray-100); }
tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #eef4fc; }
tbody tr.selected-row { background: #dbeafe !important; }
td {
  padding: 9px 10px; text-align: right;
  color: var(--text); white-space: nowrap;
  vertical-align: middle; font-weight: 600; font-size: 15px;
}
td.left { text-align: left; }
td.center { text-align: center; }
td.col-check, th.col-check { text-align: center; padding: 6px 8px; width: 36px; }
input[type="checkbox"] { cursor: pointer; accent-color: var(--blue); width: 15px; height: 15px; }
td.so { font-weight: 700; color: var(--navy); font-size: 14px; }
td.item { font-weight: 700; color: var(--navy); }
.deposit-qty { font-weight: 800; color: var(--red); }
.deposit-val { font-weight: 700; color: var(--red); }
.stored-qty  { font-weight: 800; color: var(--orange); }
.profit-neg  { color: var(--red); font-weight: 800; }
span.dim { color: var(--gray-200); font-weight: 400; }

/* STATUS BADGE */
.badge { display: inline-block; border-radius: 5px; font-size: 13px; font-weight: 700; padding: 3px 10px; white-space: nowrap; }
.badge-ready      { background: #2563a8; color: #fff; }
.badge-stored-many{ background: #ffc107; color: #7a5200; border: 1px solid #e0a800; }
.badge-abroad     { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.badge-partial    { background: var(--gray-100); color: var(--gray-700); }
.badge-stored     { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

/* FOOTER TOTALS */
tfoot tr { background: #eef3fb; border-top: 2px solid var(--blue); }
tfoot td { padding: 10px 10px; font-weight: 800; color: var(--navy); font-size: 16px; text-align: right; white-space: nowrap; }
tfoot td.left { text-align: left; }
tfoot td.total-sale   { color: var(--navy); }
tfoot td.total-inv    { color: var(--red); }
tfoot td.total-profit { color: var(--green); }
tfoot td.total-profit-neg { color: var(--red); }

/* SELECTED FOOTER */
.selected-footer {
  position: sticky; bottom: 0;
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: #fff; padding: 12px 24px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  box-shadow: 0 -4px 20px rgba(27,58,92,0.25);
  border-radius: 16px 14px 0 0; font-size: 13px; font-weight: 600;
}
.selected-footer.hidden { display: none; }
.sel-footer-title { font-weight: 800; font-size: 14px; opacity: 0.85; }
.sel-footer-items { display: flex; gap: 24px; flex-wrap: wrap; }
.sel-footer-item .lbl { font-size: 12px; opacity: 0.7; display: block; }
.sel-footer-item .val { font-size: 17px; font-weight: 800; }
.val-red    { color: #fca5a5; }
.val-yellow { color: #fde68a; }
.val-white  { color: #fff; }
.btn-clear {
  margin-left: auto;
  background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.35);
  color: #fff; font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700; padding: 5px 16px; border-radius: 20px;
  cursor: pointer; transition: all 0.15s;
}
.btn-clear:hover { background: rgba(255,255,255,0.3); }

/* ERROR BANNER */
#errorBanner {
  background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;
  border-radius: 10px; padding: 14px 20px; margin-bottom: 1rem;
  font-weight: 600; font-size: 15px;
}
#errorBanner.hidden { display: none; }

@media (max-width: 768px) {
  body { padding: 0.8rem; font-size: 14px; }
  .toolbar input#searchInput { width: 100%; }
  .page-title { font-size: 18px; }
}
</style>
</head>
<body>

<!-- KPI -->

<!-- MAIN PANEL -->
<div class="panel">
  <!-- COLUMN TOGGLE -->

  <!-- TABLE -->
  <div class="tbl-wrap">

          <th class="left"  style="min-width:92px"  data-col="so">Sales Order <span class="sort-arrow">↕</span></th>

          <th data-th="deposit"    class="grp-l" style="min-width:60px" data-col="deposit">รอ INV. <span class="sort-arrow">↕</span></th>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = 'https://hrekxmmkwfwhsuaphwlz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZWt4bW1rd2Z3aHN1YXBod2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Njk0NDgsImV4cCI6MjA5MzE0NTQ0OH0.SfCiA5jTaPVUA1_2NuxUUgr_7ePGAzZM958EFJynnAI';

const api = (path, opts = {}) =>
  fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...opts.headers
    },
    ...opts
  });

/* ===== STATE ===== */
let raw = [];
let sortCol = 'depositVal';
let sortDir = -1;
const hiddenCols = new Set(['costPrice', 'costAmt', 'profit', 'salePrice', 'saleAmt', 'remark']);
let selectedRows = new Set();
let searchTags = [];

/* ===== LOAD DATA ===== */
async function loadData() {
  showLoading(true);
  try {
    const res = await api('orders?select=*&order=id.asc');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    raw = data.map(r => ({
      id:         r.id,
      so:         r.so,
      item:       r.item,
      salePrice:  Number(r.sale_price),
      costPrice:  r.cost_price != null ? Number(r.cost_price) : null,
      order:      r.qty,
      deposit:    r.deposit,
      inv:        r.inv,
      stored:     r.stored,
      update:     r.update_note || '',
      salesco:    r.salesco,
      depositVal: 0, remain: 0, saleAmt: 0, costAmt: null, profit: null
    }));
    computeFields();
    const latest = data.reduce((a, b) => a.updated_at > b.updated_at ? a : b, data[0]);
    if (latest) {
      const d = new Date(latest.updated_at);
      document.getElementById('lastUpdated').textContent =
        'อัปเดต ' + d.toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric',
          hour:'2-digit', minute:'2-digit'});
    }
    hideError();
    renderSummary();
    renderTable();
  } catch(e) {
    showError('ไม่สามารถโหลดข้อมูลได้: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function computeFields() {
  raw.forEach(r => {
    r.saleAmt    = r.salePrice * r.order;
    r.depositVal = r.salePrice * r.deposit;
    r.remain     = Math.max(r.order - r.deposit - r.inv, 0);
    r.costAmt    = r.costPrice != null ? r.costPrice * r.order : null;
    r.profit     = r.costAmt  != null ? r.saleAmt - r.costAmt : null;
  });
}

function showLoading(v) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !v);
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = '⚠️ ' + msg;
  el.classList.remove('hidden');
}
function hideError() {
  document.getElementById('errorBanner').classList.add('hidden');
}

/* ===== STATUS ===== */
function getStatus(r) {
  if (r.stored > 1)                    return 'ready';
  if (r.stored > 0)                    return 'ready';
  if (r.deposit === 0 && r.remain > 0) return 'abroad';
  if (r.deposit > 0)                   return 'ready';
  return 'partial';
}

/* ===== FORMAT ===== */
function fmt(n)      { return (n != null && n !== 0) ? n.toLocaleString('th-TH') : '-'; }
function fmtMoney(n) {
  if (n == null || n === 0) return '<span class="dim">-</span>';
  return n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function dash(n) {
  return (n != null && n > 0) ? `<span style="font-weight:700">${fmt(n)}</span>` : `<span class="dim">-</span>`;
}

/* ===== SUMMARY ===== */
function renderSummary() {
  const counts = {abroad:0, partial:0, ready:0, stored:0};
  raw.forEach(r => { const s = getStatus(r); if (counts[s] !== undefined) counts[s]++; });
  const totalSale    = raw.reduce((s, r) => s + (r.saleAmt    || 0), 0);
  const totalWaitInv = raw.reduce((s, r) => s + (r.depositVal || 0), 0);
  document.getElementById('summaryGrid').innerHTML = `
    <div class="metric m-total">
      <div class="metric-label">รายการทั้งหมด</div>
      <div class="metric-value c-blue">${raw.length}</div>
      <div class="metric-sub">Sales Orders</div>
    </div>
    <div class="metric m-abroad">
      <div class="metric-label">ตปท.</div>
      <div class="metric-value c-red">${counts.abroad}</div>
      <div class="metric-sub">รายการ</div>
    </div>
    <div class="metric m-stored">
      <div class="metric-label">พร้อมส่ง</div>
      <div class="metric-value c-orange">${counts.ready}</div>
      <div class="metric-sub">รายการ</div>
    </div>`;
}

/* ===== TAGS ===== */
function renderTags() {
  document.getElementById('tagBar').innerHTML = searchTags.map((t, i) =>
    `<span class="tag">${t}<span class="tag-x" data-i="${i}">✕</span></span>`
  ).join('');
  document.querySelectorAll('.tag-x').forEach(x =>
    x.addEventListener('click', () => {
      searchTags.splice(+x.dataset.i, 1);
      renderTags(); renderTable();
    })
  );
}

/* ===== RENDER TABLE ===== */
function renderTable() {
  const q      = document.getElementById('searchInput').value.trim().toLowerCase();
  const fSt    = document.getElementById('filterStatus').value;
  const fSales = document.getElementById('filterSales').value;

  let filtered = raw.filter(r => {
    const allTags = [...searchTags, ...(q ? [q] : [])];
    const matchSearch = allTags.every(t =>
      r.so.toLowerCase().includes(t) ||
      r.item.toLowerCase().includes(t) ||
      r.salesco.toLowerCase().includes(t)
    );
    const matchStatus = !fSt    || getStatus(r) === fSt;
    const matchSales  = !fSales || r.salesco === fSales;
    return matchSearch && matchStatus && matchSales;
  });

  /* Sort */
  filtered.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === 'status') { va = getStatus(a); vb = getStatus(b); }
    if (va == null) return 1; if (vb == null) return -1;
    if (typeof va === 'string') return va.localeCompare(vb, 'th') * sortDir;
    return (va - vb) * sortDir;
  });

  document.getElementById('tableBody').innerHTML = filtered.map((r, i) => {
    const status = getStatus(r);
    const badge = {
      ready:       `<span class="badge badge-ready">พร้อมส่ง</span>`,
      stored_many: `<span class="badge badge-stored-many">พร้อมส่ง</span>`,
      abroad:      `<span class="badge badge-abroad">ตปท.</span>`,
      partial:     `<span class="badge badge-partial">บางส่วน</span>`,
      stored:      `<span class="badge badge-stored">ฝากของ</span>`,
    }[status] || '';
    const depositCell    = r.deposit > 0 ? `<span class="deposit-qty">${fmt(r.deposit)}</span>` : `<span class="dim">-</span>`;
    const depositValCell = r.depositVal > 0 ? `<span class="deposit-val">${fmtMoney(r.depositVal)} ฿</span>` : `<span class="dim">-</span>`;
    const storedCell     = r.stored > 0 ? `<span class="stored-qty">${fmt(r.stored)}</span>` : `<span class="dim">-</span>`;
    const checked = selectedRows.has(r.id) ? 'checked' : '';
    const selClass = selectedRows.has(r.id) ? 'selected-row' : '';
      /* แสดงผลข้อมูล ตาราง */
    return `<tr class="${selClass}" data-id="${r.id}">
      <td class="col-check center"><input type="checkbox" class="row-check" data-id="${r.id}" ${checked}/></td>
      <td class="so left">${r.so}</td>
      <td class="item left">${r.item}</td>
      <td data-td="salePrice">${fmt(r.salePrice)} ฿</td>
      <td data-td="costPrice">${r.costPrice != null ? fmt(r.costPrice)+' ฿' : '<span class="dim">-</span>'}</td>
      <td class="sale-val" data-td="saleAmt">${fmtMoney(r.saleAmt)} ฿</td>
      <td data-td="costAmt">${r.costAmt != null ? fmtMoney(r.costAmt)+' ฿' : '<span class="dim">-</span>'}</td>
      <td data-td="profit">
        ${r.profit == null ? '<span class="dim">-</span>' :
          r.profit > 0 ? `<span style="color:#1a7a4a;font-weight:700">${fmtMoney(r.profit)} ฿</span>` :
          r.profit < 0 ? `<span class="profit-neg">${fmtMoney(r.profit)} ฿</span>` :
          '<span class="dim">-</span>'}
      </td>
      <td class="num" data-td="order">${fmt(r.order)}</td>
      <td class="grp-l" data-td="deposit">${depositCell}</td>
      <td data-td="depositVal">${depositValCell}</td>
      <td class="grp-l" data-td="inv">${dash(r.inv)}</td>
      <td data-td="stored">${storedCell}</td>
      <td class="grp-l" data-td="remain">${dash(r.remain)}</td>
      <td class="grp-l" data-td="status">${badge}</td>
      <td class="left" data-td="remark" style="color:#8a94a8;font-size:13px">${r.update||'-'}</td>

      <td class="salesco left" data-td="salesco">${r.salesco}</td>
    </tr>`;
  }).join('');

  const tSale    = filtered.reduce((s, r) => s + (r.saleAmt    || 0), 0);
  const tWaitInv = filtered.reduce((s, r) => s + (r.depositVal || 0), 0);
  const tRemain  = filtered.reduce((s, r) => s + (r.remain     || 0), 0);
  const tOrder   = filtered.reduce((s, r) => s + (r.order      || 0), 0);
  const tInv     = filtered.reduce((s, r) => s + (r.inv        || 0), 0);
  const tstored  = filtered.reduce((s, r) => s + (r.stored      || 0), 0);
  const tCost    = filtered.every(r => r.costAmt == null) ? null : filtered.reduce((s, r) => s + (r.costAmt || 0), 0);
  const tProfit  = tCost != null ? tSale - tCost : null;
  const profitClass = tProfit == null ? '' : tProfit >= 0 ? 'total-profit' : 'total-profit-neg';
/* แสดงผล คำนวณทุก คอลัมน์*/
  document.getElementById('tableFoot').innerHTML = `<tr>
    <td></td>
    <td class="left" colspan="2" style="font-weight:800;color:#1b3a5c;font-size:15px">รวมทั้งหมด ${filtered.length} รายการ</td>
    <td data-td="salePrice"></td><td data-td="costPrice"></td>
    <td class="total-sale" data-td="saleAmt">${fmtMoney(tSale)} ฿</td>
    <td class="total-cost" data-td="costAmt">${tCost != null ? fmtMoney(tCost)+' ฿' : '<span class="dim">-</span>'}</td>
    <td class="${profitClass}" data-td="profit">${tProfit != null ? fmtMoney(tProfit)+' ฿' : '<span class="dim">-</span>'}</td>
    <td data-td="order" style="font-weight:800">${fmt(tOrder)}</td>
    <td class="grp-l" data-td="deposit"></td>
    <td class="total-inv" data-td="depositVal">${fmtMoney(tWaitInv)} ฿</td>
    <td class="grp-l" data-td="inv" style="font-weight:800">${fmt(tInv)}</td>
    <td data-td="stored">${fmt(tstored)}</td>
    <td class="grp-l" data-td="remain" style="font-weight:800;color:#1b3a5c">${fmt(tRemain)}</td>
    <td class="grp-l" data-td="status"></td><td data-td="salesco"></td><td data-td="remark"></td>
  </tr>`;

  applyColVisibility();
  bindRowCheckboxes();
}

/* ===== CHECKBOX ===== */
function bindRowCheckboxes() {
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = +cb.dataset.id;
      if (cb.checked) selectedRows.add(id); else selectedRows.delete(id);
      cb.closest('tr').classList.toggle('selected-row', cb.checked);
      syncCheckAll(); updateSelectedFooter();
    });
  });
}
function syncCheckAll() {
  const all = document.querySelectorAll('.row-check');
  const checked = document.querySelectorAll('.row-check:checked');
  const ca = document.getElementById('checkAll');
  ca.checked = checked.length > 0 && checked.length === all.length;
  ca.indeterminate = checked.length > 0 && checked.length < all.length;
}
function updateSelectedFooter() {
  const selData = raw.filter(r => selectedRows.has(r.id));
  const footer = document.getElementById('selectedFooter');
  if (selData.length === 0) {
    footer.classList.add('hidden');
    return;
  }
  const totalSaleAmt = selData.reduce((s,r)=>s+(r.saleAmt||0),0);
  const totalDepVal  = selData.reduce((s,r)=>s+(r.depositVal||0),0);
  const fmtNum = n => n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});

  footer.classList.remove('hidden');
  document.getElementById('selCount').textContent     = selData.length;
  document.getElementById('selAmount').innerHTML      = fmtMoney(totalSaleAmt) + ' ฿';
  document.getElementById('selDepositVal').innerHTML  = fmtMoney(totalDepVal) + ' ฿';

  
}
document.getElementById('checkAll').addEventListener('change', function() {
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.checked = this.checked;
    const id = +cb.dataset.id;
    if (this.checked) selectedRows.add(id); else selectedRows.delete(id);
    cb.closest('tr').classList.toggle('selected-row', this.checked);
  });
  updateSelectedFooter();
});
document.getElementById('btnClearSel').addEventListener('click', () => {
  selectedRows.clear(); renderTable(); updateSelectedFooter();
});


/* ===== COLUMN VISIBILITY ===== */
function applyColVisibility() {
  document.querySelectorAll('.col-btn').forEach(btn => btn.classList.toggle('hidden-col', hiddenCols.has(btn.dataset.col)));
  document.querySelectorAll('thead th[data-th]').forEach(th => th.style.display = hiddenCols.has(th.dataset.th) ? 'none' : '');
  document.querySelectorAll('tbody td[data-td], tfoot td[data-td]').forEach(td => td.style.display = hiddenCols.has(td.dataset.td) ? 'none' : '');
}
document.querySelectorAll('.col-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.dataset.col;
    if (hiddenCols.has(col)) hiddenCols.delete(col); else hiddenCols.add(col);
    renderTable();
  });
});

/* ===== SORT ===== */
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => { t.classList.remove('sort-active'); const a = t.querySelector('.sort-arrow'); if (a) a.textContent = '↕'; });
    th.classList.add('sort-active');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    renderTable();
  });
});

/* ===== SEARCH ===== */
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = searchInput.value.trim();
    if (v && !searchTags.includes(v.toLowerCase())) {
      searchTags.push(v.toLowerCase()); renderTags(); searchInput.value = ''; renderTable();
    }
  }
});
searchInput.addEventListener('input', renderTable);
['filterStatus','filterSales'].forEach(id => document.getElementById(id).addEventListener('input', renderTable));

/* ===== INIT ===== */
loadData();
</script>
</body>
</html>
