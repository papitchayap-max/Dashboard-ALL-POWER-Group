<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Order Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #dbe9ee; color: #1a1a1a; padding: 1.5rem; font-size: 36px; }
h2 { font-size: 22px; font-weight: 600; margin-bottom: 1rem; color: #1b4965; }
.summary-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: #fff; border: 0.5px solid #e5e5e3; border-radius: 10px; padding: 12px 14px; }
.metric-label { font-size: 16px; color: #1b4965; margin-bottom: 4px; font-weight: 700; }
.metric-value { font-size: 25px; font-weight: 600; }
.metric-value.c-pending { color: #bc4b51; }
.metric-value.c-abroad  { color: #bc4b51; }
.metric-value.c-partial { color: #4a536b; }
.metric-value.c-ready   { color: #4281a4; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.filters input, .filters select { font-size: 16px; padding: 6px 10px; border: 0.5px solid #ffe1a8; border-radius: 8px; background: #fff; color: #1b4965; font-weight: 700; }
.filters input { width: 250px; }
#rowCount { margin-left: auto; font-size: 16px; color: #4a536b; font-weight: 600; }
.tbl-wrap { overflow-x: auto; border: 0.5px solid #e5e5e3; border-radius: 12px; background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
thead th { background: #4a6fa5; color: #fff; font-weight: 500; padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 0.5px solid #e5e5e3; cursor: pointer; user-select: none; }
thead th.left { text-align: left; }
thead th:hover { color: #faf0ca; }
tbody tr { border-bottom: 0.5px solid #f0efeb; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #faf0ca; }
td { padding: 8px 10px; text-align: right; color: #1a1a1a; white-space: nowrap; vertical-align: middle; }
td.left { text-align: left; }
td.so { font-weight: 600; color: #1b4965; font-size: 16px; }
td.salesco { font-weight: 500; font-size: 16px; color: #1b4965; }
td.po { font-size: 16px; color: #1b4965; font-weight: 600; }
td.item { font-size: 16px; font-weight: 500; color: #1b4965; }
td.dim { color: #ccc; }
.deposit-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.deposit-qty { font-weight: 750; color: #bc4b51; }
.deposit-val { font-size: 16px; color: #bc4b51; font-weight: 550; }
.badge { display: inline-block; border-radius: 5px; font-size: 16px; font-weight: 500; padding: 2px 8px; letter-spacing: 0.02em; }
.badge-ok      { background: #eaf3de; color: #43aa8b; }
.badge-ready   { background: #4281a4; color: #fff; }
.badge-abroad  { background: #fe938c; color: #fff; }
.badge-warn    { background: #9cafb7; color: #fff; }
.badge-danger  { background: #a9d6e5; color: #a32d2d; }
.sort-arrow { font-size: 16px; margin-left: 5px; opacity: 0.4; }
.sort-active .sort-arrow { opacity: 1; }
.updated-dot {   color: #bc4b51; margin-left: 10px; vertical-align: middle; }
</style>
</head>
<body>
<h2>Dashboard ALL POWER Group </h2>
<div class="summary-grid" id="summaryGrid"></div>
<div class="filters">
  <input type="text" id="searchInput" placeholder="ค้นหา SO / Item / Sales Co." />
  <select id="filterStatus">
    <option value="">สถานะ</option>
   
    <option value="abroad">ตปท.</option>
    <option value="partial">บางส่วน</option>
    <option value="ready">พร้อมส่ง</option>
    
  </select>
  <select id="filterSales">
    <option value="">Sales Co.</option>
    <option value="Papitchaya">Papitchaya</option>
    <option value="Jureemas">Jureemas</option>
    <option value="Patcharaporn">Patcharaporn</option>
  </select>
  <span id="rowCount"></span>
</div>
<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th class="left" style="min-width:88px" data-col="so">Sales Order <span class="sort-arrow">↕</span></th>
        <th class="left" style="min-width:115px" data-col="po">ยอดรวม PO (ก่อน VAT) <span class="sort-arrow">↕</span></th>
        <th class="left" style="min-width:120px" data-col="item">Item <span class="sort-arrow">↕</span></th>
        <th style="min-width:55px" data-col="order">Order <span class="sort-arrow">↕</span></th>
        <th style="min-width:55px" data-col="invinv">INV <span class="sort-arrow">↕</span></th>
        <th style="min-width:110px" data-col="deposit">ฝากของ  <span class="sort-arrow">↕</span></th>
        <th style="min-width:55px" data-col="remain">ตปท <span class="sort-arrow">↕</span></th>
        <th style="min-width:80px" data-col="status">สถานะ <span class="sort-arrow">↕</span></th>
        <th class="left" style="min-width:90px" data-col="salesco">Sales Co. <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const raw = [
  {so:"SC-208618", po:2734800,  item:"DMG7000/M1",   order:110,  inv:63,  deposit:47,  depositVal:313960,   remain:0,   updated:false, salesco:"Papitchaya"},

  {so:"SC-214004", po:30530,    item:"GAX1020A",      order:25,   inv:0,   deposit:25,  depositVal:8200,     remain:0,   updated:true,  salesco:"Jureemas"},

  {so:"SC-214004", po:30530,    item:"GAZ016",        order:20,   inv:0,   deposit:20,  depositVal:15680,    remain:0,   updated:true,  salesco:"Jureemas"},
  {so:"SC-214374", po:44157,    item:"DM0T0050",      order:105,  inv:30,  deposit:0,   depositVal:0,        remain:75,  updated:false, salesco:"Papitchaya"},
  {so:"SC-214374", po:44157,    item:"DM0T0060",      order:12,   inv:0,   deposit:0,   depositVal:0,        remain:12,  updated:false, salesco:"Papitchaya"},
  {so:"SC-214374", po:44157,    item:"DM0T0080",      order:3,    inv:0,   deposit:0,   depositVal:0,        remain:3,   updated:false, salesco:"Papitchaya"},
  {so:"SC-214374", po:44157,    item:"DM0T0100",      order:3,    inv:0,   deposit:0,   depositVal:0,        remain:3,   updated:false, salesco:"Papitchaya"},
  {so:"SC-214426", po:69000,    item:"SASD5VR",       order:30,   inv:0,   deposit:30,  depositVal:69000,    remain:0,   updated:true,  salesco:"Patcharaporn"},

  {so:"SC-214882", po:14355,    item:"GA063SAET6",    order:5,    inv:0,   deposit:0,   depositVal:0,        remain:5,   updated:false, salesco:"Papitchaya"},
  {so:"SC-214882", po:14355,    item:"GAX5001",       order:1,    inv:0,   deposit:0,   depositVal:0,        remain:1,   updated:false, salesco:"Papitchaya"},
  {so:"SC-215045", po:5100000,  item:"DMG510",        order:800,  inv:100, deposit:451, depositVal:1127500,  remain:249, updated:true,  salesco:"Patcharaporn"},
  {so:"SC-215045", po:5100000,  item:"DMG615",        order:1000, inv:0,   deposit:112, depositVal:347200,   remain:888, updated:false, salesco:"Patcharaporn"},

  {so:"SC-215474", po:31590,    item:"DM0T0050",      order:69,   inv:0,   deposit:0,   depositVal:0,        remain:69,  updated:false, salesco:"Papitchaya"},
  {so:"SC-215474", po:31590,    item:"DM0T0060",      order:3,    inv:0,   deposit:0,   depositVal:0,        remain:3,   updated:false, salesco:"Papitchaya"},
  {so:"SC-215474", po:31590,    item:"DM0T0080",      order:3,    inv:0,   deposit:0,   depositVal:0,        remain:3,   updated:false, salesco:"Papitchaya"},
  {so:"SC-215474", po:31590,    item:"DM0T0100",      order:3,    inv:0,   deposit:3,   depositVal:1215,     remain:0,   updated:false, salesco:"Papitchaya"},
  {so:"SC-215476", po:74263.20, item:"ATL610",        order:4,    inv:0,   deposit:4,   depositVal:74263.20, remain:0,   updated:false, salesco:"Jureemas"},
  {so:"SC-215486", po:177600,   item:"DMT400-50-3",   order:48,   inv:0,   deposit:31,  depositVal:114700,   remain:17,  updated:false, salesco:"Papitchaya"},
  {so:"SC-215491", po:3660.80,  item:"GAZ016",        order:4,    inv:3,   deposit:0,   depositVal:0,        remain:1,   updated:false, salesco:"Patcharaporn"},
  {so:"SC-215573", po:77780,    item:"GAZ016",        order:50,   inv:0,   deposit:0,   depositVal:0,        remain:50,  updated:false, salesco:"Papitchaya"},
  {so:"SC-215573", po:77780,    item:"GAX1011A",      order:50,   inv:0,   deposit:0,   depositVal:0,        remain:50,  updated:false, salesco:"Papitchaya"},
  {so:"SC-215573", po:77780,    item:"GAX1020A",      order:50,   inv:0,   deposit:0,   depositVal:0,        remain:50,  updated:false, salesco:"Papitchaya"},
  {so:"SC-215671", po:9720,     item:"DM0T0050",      order:24,   inv:0,   deposit:0,   depositVal:0,        remain:24,  updated:false, salesco:"Jureemas"},
  {so:"SC-216009", po:9300,     item:"DMT525-40-3",   order:3,    inv:0,   deposit:0,   depositVal:0,        remain:3,   updated:false, salesco:"Papitchaya"},
];

function getStatus(r) {
  
  if (r.remain === r.order && r.inv === 0 && r.deposit === 0) return 'abroad';
  if (r.deposit >= r.order && r.inv === 0) return 'ready';
  if (r.inv > 0 || r.deposit > 0 || r.remain > 0) return 'partial';
  return 'pending';
}

let sortCol = 'so', sortDir = 1;
function fmt(n) { return n ? n.toLocaleString('th-TH') : '-'; }
function fmtMoney(n) {
  if (!n) return '-';
  return n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function renderSummary() {
  const counts = {pending:0, abroad:0, partial:0, ready:0, };
  raw.forEach(r => counts[getStatus(r)]++);
  document.getElementById('summaryGrid').innerHTML = `
    <div class="metric"><div class="metric-label">รายการทั้งหมด</div><div class="metric-value">${raw.length}</div></div>
   
    <div class="metric"><div class="metric-label">ตปท.</div><div class="metric-value c-abroad">${counts.abroad}</div></div>
    <div class="metric"><div class="metric-label">บางส่วน</div><div class="metric-value c-partial">${counts.partial}</div></div>
    <div class="metric"><div class="metric-label">พร้อมส่ง</div><div class="metric-value c-ready">${counts.ready}</div></div>
  `;
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const salesFilter = document.getElementById('filterSales').value;

  let filtered = raw.filter(r => {
    const matchSearch = r.so.toLowerCase().includes(search)
      || r.item.toLowerCase().includes(search)
      || r.salesco.toLowerCase().includes(search);
    const matchStatus = !statusFilter || getStatus(r) === statusFilter;
    const matchSales = !salesFilter || r.salesco === salesFilter;
    return matchSearch && matchStatus && matchSales;
  });

  filtered.sort((a,b) => {
    let av, bv;
    if (sortCol === 'salesco') { av = a.salesco; bv = b.salesco; return sortDir * av.localeCompare(bv); }
    if (sortCol === 'po') { av = a.po||0; bv = b.po||0; return sortDir*(av-bv); }
    if (sortCol === 'status') { av = getStatus(a); bv = getStatus(b); return sortDir * av.localeCompare(bv); }
    av = a[sortCol]; bv = b[sortCol];
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * ((av||0)-(bv||0));
  });

  document.getElementById('rowCount').textContent = `แสดง ${filtered.length} / ${raw.length} รายการ`;

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = filtered.map(r => {
    const s = getStatus(r);
    const badge =
     
      s === 'ready'   ? '<span class="badge badge-ready">พร้อมส่ง</span>' :
      s === 'abroad'  ? '<span class="badge badge-abroad">ตปท.</span>' :
      s === 'partial' ? '<span class="badge badge-warn">บางส่วน</span>' :'';
          

    const depositCell = r.deposit > 0
      ? `<div class="deposit-wrap"><span class="deposit-qty">${fmt(r.deposit)}</span><span class="deposit-val">${fmtMoney(r.depositVal)} ฿</span></div>`
      : `<span class="dim">-</span>`;

    const remainTd = r.remain > 0
      ? `<td style="color:#1b4965;font-weight:600">${fmt(r.remain)}</td>`
      : `<td class="dim">-</td>`;

    const updatedDot = r.updated ? `<span class="updated-dot" title="อัปเดต">(29-04)</span>` : '';

    return `<tr>
      <td class="so left">${r.so}</td>
      <td class="po left">${fmtMoney(r.po)} ฿</td>
      <td class="item left">${r.item}${updatedDot}</td>
      <td style="color:#1b4965;font-weight:600">${fmt(r.order)}</td>
      <td style="color:#1b4965;font-weight:600">${r.inv > 0 ? fmt(r.inv) : '<span class="dim">-</span>'}</td>
      <td>${depositCell}</td>
      ${remainTd}
      <td>${badge}</td>
      <td class="salesco left">${r.salesco}</td>
    </tr>`;
  }).join('');
}

['searchInput','filterStatus','filterSales'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderTable)
);

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-active'));
    th.classList.add('sort-active');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    renderTable();
  });
});

renderSummary();
renderTable();
</script>
</body>
</html>
